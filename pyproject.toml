[project]
name = "pruning-runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imgclassvalidation",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "torch-pruning>=1.6.1",
    "torchvision>=0.27.0",
    "typer>=0.26.7",
]

[tool.uv.sources]
imgclassvalidation = { git = "https://github.com/Hiragi14/imgclassvalidation.git" }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
